# @package _global_
# Stage-A source: Dirichlet attention + pre-fusion uncertainty, trained on
# ImageNet-100 acc85 base models. Dirichlet KL regularization is intentionally
# disabled so this is a clean pre-fusion ablation.

frozen_fusion_tag: attn_stage_a_dirichlet_linear_prefusion_uncertainty_imagenet100_acc85_resnet_vgg_densenet_effnet_vit

pipeline:
  attention_method: dirichlet
  classifier_method: linear
  pretrained: false
  base_models_path: models/base
  model_save_path: models
  subfolders: [acc85]
  model_names: [ResNet18, VGG16, DenseNet121, EfficientNetB0, ViT-B16]
  use_pre_fusion_uncertainty: true
  pre_fusion_uncertainty_hidden_dim: 128
  pre_fusion_uncertainty_eps: 1e-6
  pre_fusion_aux_loss_weight: 0.1
  pre_fusion_cali_loss_weight: 0.05
  pre_fusion_cali_eps: 1e-8
  dirichlet_kl_regularization: false
  dirichlet_kl_lambda: 0.0
  dirichlet_kl_warmup_epochs: 0
